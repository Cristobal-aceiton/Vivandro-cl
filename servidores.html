    <script>
    /*
      theme.js
      -----------------------------------------------------------
      Modo oscuro/claro compartido. Requiere:
        - Un botón con id="theme-toggle" en la navbar de cada página
        - Reglas CSS ".dark-mode ..." definidas en cada página
          (ya agregadas en index.html, mods.html, servidores.html,
          texturas.html, servidor-detalle.html y 404.html)
    
      El icono del botón es un SVG inline (sol/luna) en vez de un
      emoji: así se ve igual en todos los sistemas operativos y
      navegadores, en vez de depender de la fuente de emojis de
      cada plataforma.
      -----------------------------------------------------------
    */
    
    (function () {
        const KEY = "vivandro-theme";
        const saved = localStorage.getItem(KEY) || "dark";
    
        const ICONO_LUNA = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M20.742 13.045a8.088 8.088 0 0 1-2.077.273c-4.508 0-8.16-3.653-8.16-8.16 0-1.174.25-2.353.732-3.404a.75.75 0 0 0-.926-1.02A10.5 10.5 0 1 0 22.47 13.727a.75.75 0 0 0-.99-.847 8.06 8.06 0 0 1-.738.165z"/></svg>';
        const ICONO_SOL = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 4.5a1 1 0 0 1-1-1v-2a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1zm0 19a1 1 0 0 1-1-1v-2a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1zM4.22 5.64a1 1 0 0 1-1.42 0l-1.4-1.42a1 1 0 1 1 1.4-1.42l1.42 1.42a1 1 0 0 1 0 1.42zm16.98 16.98a1 1 0 0 1-1.42 0l-1.4-1.42a1 1 0 1 1 1.4-1.42l1.42 1.42a1 1 0 0 1 0 1.42zM2.5 13h-2a1 1 0 1 1 0-2h2a1 1 0 1 1 0 2zm21 0h-2a1 1 0 1 1 0-2h2a1 1 0 1 1 0 2zM4.22 20.36a1 1 0 0 1 0-1.42l1.42-1.4a1 1 0 1 1 1.42 1.4l-1.42 1.42a1 1 0 0 1-1.42 0zM18.36 5.64a1 1 0 0 1 0-1.42l1.42-1.4a1 1 0 1 1 1.42 1.4l-1.42 1.42a1 1 0 0 1-1.42 0zM12 6.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>';
    
        function aplicarTema(tema) {
            document.documentElement.classList.toggle("dark-mode", tema === "dark");
        }
    
        // Aplicar antes de pintar para evitar parpadeo
        aplicarTema(saved);
    
        document.addEventListener("DOMContentLoaded", () => {
            const boton = document.getElementById("theme-toggle");
            if (!boton) return;
    
            boton.innerHTML = saved === "dark" ? ICONO_SOL : ICONO_LUNA;
    
            boton.addEventListener("click", () => {
                const esOscuro = document.documentElement.classList.toggle("dark-mode");
                localStorage.setItem(KEY, esOscuro ? "dark" : "light");
                boton.innerHTML = esOscuro ? ICONO_SOL : ICONO_LUNA;
            });
        });
    })();
    </script>

    <script>

        const contenedor = document.getElementById("servidores-container");
        const buscadorInput = document.getElementById("buscador-input");
        const filtrosContainer = document.getElementById("filtros-container");
        const paginacionEl = document.getElementById("paginacion");
        const LOGO_FALLBACK = "imagenes/logo.png";

        const POR_PAGINA = 6;
        let paginaActual = 1;
        let filtroActivo = null;
        let textoBusqueda = "";
        let timerBusqueda = null;
        let intervalosEstado = [];

        function mapearServidor(row) {
            return {
                id: row.id,
                nombre: row.nombre,
                logo: row.logo,
                descripcion: row.descripcion,
                jugadoresPromedio: row.jugadores_promedio,
                anioCreacion: row.anio_creacion,
                ip: row.ip,
                // "java" o "bedrock": si un servidor viejo todavía no
                // tiene esta columna cargada, se asume "java" (era el
                // único comportamiento que existía antes).
                tipoEdicion: row.tipo_edicion === "bedrock" ? "bedrock" : "java",
                modalidades: row.modalidades || [],
            };
        }

        // Los chips de filtro necesitan conocer TODAS las modalidades que
        // existen, así que se trae solo esa columna (liviana) para todos
        // los servidores, sin cargar el resto de sus datos (logo,
        // descripción, etc.).
        async function iniciar() {
            let modalidades = [];
            try {
                // conTimeout(): si Supabase no responde (conexión móvil
                // colgada), no se bloquea esta carga inicial para siempre;
                // a los 12s se sigue con la lista de modalidades vacía.
                modalidades = await conTimeout(Datos.listarModalidades(), 12000);
            } catch (e) {
                console.error("[Servidores] No se pudieron cargar las modalidades:", e.message);
                modalidades = [];
            }
            construirFiltros(modalidades);
            cargarPagina(1);
        }

        function construirFiltros(modalidadesUnicas) {
            filtrosContainer.innerHTML = "";

            const chipTodos = document.createElement("button");
            chipTodos.className = "filtro-chip activo";
            chipTodos.textContent = "Todos";
            chipTodos.dataset.modalidad = "";
            chipTodos.addEventListener("click", () => seleccionarFiltro(chipTodos, ""));
            filtrosContainer.appendChild(chipTodos);

            modalidadesUnicas.forEach((modalidad) => {
                const chip = document.createElement("button");
                chip.className = "filtro-chip";
                chip.textContent = modalidad;
                chip.dataset.modalidad = modalidad;
                chip.addEventListener("click", () => seleccionarFiltro(chip, modalidad));
                filtrosContainer.appendChild(chip);
            });
        }

        function seleccionarFiltro(chipSeleccionado, modalidad) {
            filtroActivo = modalidad || null;
            filtrosContainer.querySelectorAll(".filtro-chip").forEach((c) => c.classList.remove("activo"));
            chipSeleccionado.classList.add("activo");
            cargarPagina(1);
        }

        // Arma los botones "‹ 1 2 3 … 10 ›" a partir de la página actual
        // y el total de páginas. Solo se ven unos pocos números cerca de
        // la página actual (más el primero y el último) para que no se
        // haga interminable si hay muchas páginas.
        function paginasVisibles(actual, total) {
            const paginas = [];
            for (let i = 1; i <= total; i++) {
                if (i === 1 || i === total || (i >= actual - 1 && i <= actual + 1)) {
                    paginas.push(i);
                } else if (paginas[paginas.length - 1] !== "...") {
                    paginas.push("...");
                }
            }
            return paginas;
        }

        function renderPaginacion(actual, totalPaginas, onCambiar) {
            paginacionEl.innerHTML = "";
            if (totalPaginas <= 1) return;

            function crearBoton(texto, pagina, opciones = {}) {
                const btn = document.createElement("button");
                btn.textContent = texto;
                btn.type = "button";
                if (opciones.activo) btn.classList.add("activo");
                if (opciones.deshabilitado) btn.disabled = true;
                btn.addEventListener("click", () => onCambiar(pagina));
                return btn;
            }

            paginacionEl.appendChild(crearBoton("‹", actual - 1, { deshabilitado: actual === 1 }));
            paginasVisibles(actual, totalPaginas).forEach((p) => {
                if (p === "...") {
                    const span = document.createElement("span");
                    span.className = "paginacion-puntos";
                    span.textContent = "…";
                    paginacionEl.appendChild(span);
                } else {
                    paginacionEl.appendChild(crearBoton(String(p), p, { activo: p === actual }));
                }
            });
            paginacionEl.appendChild(crearBoton("›", actual + 1, { deshabilitado: actual === totalPaginas }));
        }

        // Tarjetas "esqueleto": se muestran de inmediato mientras se
        // consulta Supabase, para que la página no aparezca vacía/en
        // blanco esos primeros instantes. Tienen la misma forma que una
        // tarjeta real, pero con bloques grises animados en vez de datos.
        function crearSkeletons(cantidad) {
            const frag = document.createDocumentFragment();
            for (let i = 0; i < cantidad; i++) {
                const div = document.createElement("div");
                div.className = "server-card skeleton-card";
                div.innerHTML = `
                    <div class="server-logo-box skeleton-shimmer"></div>
                    <div class="server-info">
                        <div class="skeleton-line skeleton-titulo"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line" style="width:60%"></div>
                        <div class="skeleton-line skeleton-boton"></div>
                    </div>
                `;
                frag.appendChild(div);
            }
            return frag;
        }

        // Trae solo los 6 servidores de la página pedida (con su
        // búsqueda/filtro de modalidad aplicados en la base de datos, no
        // en el navegador), así la web no se pone pesada aunque haya
        // muchos servidores. Al agregar un servidor número 7, 13, 19...
        // se crea sola una página nueva porque totalPaginas se recalcula
        // con el total real que devuelve Supabase.
        async function cargarPagina(pagina) {
            contenedor.innerHTML = "";
            contenedor.appendChild(crearSkeletons(POR_PAGINA));
            paginacionEl.innerHTML = "";

            // Se cancelan los refrescos automáticos de la página anterior
            // (si no, seguirían llamando a mcstatus.io de fondo por
            // servidores que ya no están a la vista).
            intervalosEstado.forEach((id) => clearInterval(id));
            intervalosEstado = [];

            let resultado;
            let promedios = {};
            try {
                // conTimeout(): antes, si la petición a Supabase se quedaba
                // colgada (sin resolver ni rechazar, algo que puede pasar
                // en redes móviles inestables), el "await" nunca terminaba
                // y el skeleton quedaba animando para siempre. A los 12s
                // sin respuesta se corta y se cae al "catch" con el mensaje
                // de error + botón de reintentar.
                resultado = await conTimeout(
                    Datos.listarPagina("servidores", {
                        pagina,
                        porPagina: POR_PAGINA,
                        busqueda: textoBusqueda,
                        modalidad: filtroActivo,
                    }),
                    12000
                );

                // El promedio de reseñas se trae dentro del mismo try: si
                // esta consulta puntual fallara, no queremos perder toda la
                // página de servidores ya cargada, así que un fallo acá
                // solo deja los promedios en 0 (ver catch interno) en vez
                // de tirar toda la carga de la página.
                try {
                    promedios = await conTimeout(Datos.promedioResenas(resultado.datos.map((s) => s.id)), 12000);
                } catch (e) {
                    console.error("[Servidores] No se pudieron cargar los promedios de reseñas:", e.message);
                    promedios = {};
                }
            } catch (e) {
                console.error("[Servidores] No se pudieron cargar los servidores:", e.message);
                contenedor.innerHTML = '<p class="sin-resultados">No se pudieron cargar los servidores. Revisa tu conexión e intenta de nuevo.<br><button type="button" class="btn-reintentar" id="btn-reintentar-servidores">Reintentar</button></p>';
                const btnReintentar = document.getElementById("btn-reintentar-servidores");
                if (btnReintentar) btnReintentar.addEventListener("click", () => cargarPagina(pagina));
                return;
            }

            paginaActual = pagina;
            const { datos, total, totalPaginas } = resultado;
            contenedor.innerHTML = "";

            if (total === 0) {
                contenedor.innerHTML = '<p class="sin-resultados">No encontramos servidores con ese criterio.</p>';
                return;
            }

            datos.map(mapearServidor).forEach((server, indice) => {
                const card = document.createElement("div");
                card.className = "server-card";
                // server.id se usa además como id de HTML y en la URL, así
                // que se limpia con encodeURIComponent; el resto de campos
                // pasa por escapeHTML antes de insertarse con innerHTML.
                const idSeguro = encodeURIComponent(server.id);
                const logoSeguro = sanitizeURL(server.logo) || LOGO_FALLBACK;
                const numero = (pagina - 1) * POR_PAGINA + indice + 1;
                // Si el servidor todavía no tiene reseñas, se muestra en
                // 0 (sin estrellas rellenas) en vez de ocultar el bloque,
                // así la card siempre tiene el mismo layout.
                const infoResenas = promedios[server.id] || { promedio: 0, total: 0 };
                const promedioRedondeado = Math.round(infoResenas.promedio);
                const estrellasHTML = "★".repeat(promedioRedondeado) + "☆".repeat(5 - promedioRedondeado);
                const textoResenas = infoResenas.total === 0
                    ? "Sin reseñas todavía"
                    : `${infoResenas.total} reseña${infoResenas.total === 1 ? "" : "s"}`;
                card.innerHTML = `
                    <div class="server-logo-box">
                        <div class="server-numero">${numero}</div>
                        <div class="estado-badge" id="estado-${idSeguro}">
                            <span class="estado-punto"></span>
                            <span class="estado-texto">Consultando...</span>
                        </div>
                        <img
                            src="${logoSeguro}"
                            alt="Logo ${escapeHTML(server.nombre)}"
                            loading="lazy"
                            onerror="this.onerror=null; this.src='${LOGO_FALLBACK}';"
                        >
                    </div>
                    <div class="server-info">
                        <h2>${escapeHTML(server.nombre)}</h2>
                        <div class="server-resenas-resumen">
                            <span class="server-resenas-estrellas">${estrellasHTML}</span>
                            <span class="server-resenas-promedio">${infoResenas.promedio.toFixed(1)}</span>
                            <span class="server-resenas-total">(${textoResenas})</span>
                        </div>
                        <p>${escapeHTML(server.descripcion)}</p>
                        <div class="server-stats">
                            <div class="stat-item">
                                <span class="stat-label">Jugadores promedio</span>
                                <span class="stat-value">${escapeHTML(server.jugadoresPromedio)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Año de creación</span>
                                <span class="stat-value">${escapeHTML(server.anioCreacion)}</span>
                            </div>
                        </div>
                        <div class="ip-row">
                            <span class="ip-texto">${escapeHTML(server.ip)}</span>
                            <button class="btn-copiar-ip">Copiar IP</button>
                        </div>
                        <div class="modalidades">
                            ${server.modalidades.map((m) => `<span class="modalidad-tag">${escapeHTML(m)}</span>`).join("")}
                        </div>
                        <a class="btn-ver-mas" href="/servidor-detalle?id=${idSeguro}">Ver más y opinar</a>
                    </div>
                `;
                contenedor.appendChild(card);
                consultarEstadoServidor(server);
            });

            activarBotonesCopiarIp();
            actualizarSeoItemList(datos.map(mapearServidor));

            renderPaginacion(paginaActual, totalPaginas, (p) => {
                if (p < 1 || p > totalPaginas || p === paginaActual) return;
                cargarPagina(p);
                contenedor.scrollIntoView({ behavior: "smooth", block: "start" });
            });
        }

        // SEO: mantiene un bloque JSON-LD (ItemList) con los servidores
        // que están realmente visibles en la página actual, para que los
        // buscadores entiendan el listado aunque se cargue por JS.
        function actualizarSeoItemList(servidoresVisibles) {
            let script = document.getElementById("seo-itemlist-servidores");
            if (!script) {
                script = document.createElement("script");
                script.type = "application/ld+json";
                script.id = "seo-itemlist-servidores";
                document.head.appendChild(script);
            }
            const data = {
                "@context": "https://schema.org",
                "@type": "ItemList",
                "itemListElement": servidoresVisibles.map((server, i) => ({
                    "@type": "ListItem",
                    "position": i + 1,
                    "name": server.nombre,
                    "url": `https://vivandro-cl-i1x2.vercel.app/servidor-detalle?id=${encodeURIComponent(server.id)}`,
                })),
            };
            script.textContent = JSON.stringify(data);
        }

        function activarBotonesCopiarIp() {
            document.querySelectorAll(".btn-copiar-ip").forEach((boton) => {
                boton.addEventListener("click", () => {
                    const ip = boton.previousElementSibling.textContent.trim();
                    navigator.clipboard.writeText(ip).then(() => {
                        const textoOriginal = boton.textContent;
                        boton.textContent = "¡Copiado!";
                        boton.classList.add("copiado");
                        setTimeout(() => {
                            boton.textContent = textoOriginal;
                            boton.classList.remove("copiado");
                        }, 1500);
                    });
                });
            });
        }

        // Estado en vivo (online/offline + jugadores) vía mcstatus.io.
        // Se consulta al mostrar la card y luego se refresca sola cada
        // 60 segundos mientras esa página siga a la vista.
        const INTERVALO_ESTADO_MS = 60000;

        function consultarEstadoServidor(server) {
            const badge = document.getElementById(`estado-${server.id}`);
            if (!badge) return;

            function actualizar() {
                const texto = badge.querySelector(".estado-texto");
                const controlador = new AbortController();
                const timeout = setTimeout(() => controlador.abort(), 8000);

                // Java Edition y Bedrock Edition usan protocolos y puertos
                // distintos, así que mcstatus.io tiene un endpoint separado
                // para cada uno. Sin esto, un servidor Bedrock consultado
                // como si fuera Java siempre aparecía offline.
                const endpoint = server.tipoEdicion === "bedrock" ? "bedrock" : "java";
                // La IP se codifica antes de insertarla en la URL: sin esto,
                // una IP con caracteres como "/" podría alterar la ruta de
                // la petición (por ejemplo, apuntar a otro endpoint distinto
                // del esperado en la API de mcstatus.io).
                const ipSegura = encodeURIComponent(server.ip);

                fetch(`https://api.mcstatus.io/v2/status/${endpoint}/${ipSegura}`, { signal: controlador.signal })
                    .then((res) => {
                        if (!res.ok) throw new Error("Respuesta no válida");
                        return res.json();
                    })
                    .then((data) => {
                        clearTimeout(timeout);
                        badge.classList.remove("online", "offline");
                        if (data && data.online) {
                            badge.classList.add("online");
                            const jugadores = data.players ? data.players.online : null;
                            texto.textContent = jugadores !== null && jugadores !== undefined ? `Online · ${jugadores}` : "Online";
                        } else {
                            badge.classList.add("offline");
                            texto.textContent = "Offline";
                        }
                    })
                    .catch(() => {
                        clearTimeout(timeout);
                        badge.classList.remove("online");
                        badge.classList.add("offline");
                        texto.textContent = "Estado no disponible";
                    });
            }

            actualizar();
            const idIntervalo = setInterval(actualizar, INTERVALO_ESTADO_MS);
            intervalosEstado.push(idIntervalo);
        }

        buscadorInput.addEventListener("input", () => {
            clearTimeout(timerBusqueda);
            timerBusqueda = setTimeout(() => {
                textoBusqueda = buscadorInput.value.trim();
                cargarPagina(1);
            }, 350);
        });

        // Si se llega desde el buscador global del Hero (servidores.html?buscar=...)
        // se precarga el texto en el buscador de esta página.
        const busquedaInicial = new URLSearchParams(window.location.search).get("buscar");
        if (busquedaInicial) {
            buscadorInput.value = busquedaInicial;
            textoBusqueda = busquedaInicial.trim();
        }

        iniciar();

    </script>

</body>
</html>
